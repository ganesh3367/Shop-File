# Render Blueprint (free plan): one web service runs the website and the API.
# The free plan has no persistent disk, so all data (database + uploaded files) lives in Turso.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: gany-furniture
    runtime: node
    rootDir: gany-furniture
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Turso database (turso.tech → your database → copy the URL and create a token).
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Signs login tokens. Render generates a random value once and keeps it.
      - key: JWT_SECRET
        generateValue: true
      # First admin account, created on first start. Render asks for these in the dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
